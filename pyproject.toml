[project]
name = "little-tree-clock"
version = "1.0.1"
description = "小树时钟 — 基于 PySide6 + QFluentWidgets 的桌面时钟工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "lunardate>=0.2.2",
    "ntplib>=0.4.0",
    "pillow>=12.2.0",
    "pip>=26.1.1",
    "platformdirs>=4.10.0",
    "psutil>=7.2.2",
    "pynput>=1.8.2",
    "pyside6>=6.11.1",
    "pyside6-fluent-widgets[full]>=1.11.2",
    "requests>=2.34.2",
    "tzdata>=2026.2",
]

[tool.uv.workspace]
members = [
    "tools/plugin_cli",
]
